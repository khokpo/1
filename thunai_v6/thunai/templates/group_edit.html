{% extends 'base.html' %}{% block c %}<h2>Edit group</h2><form method="post" class="card"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><div class="row">
<div><label for="n">Name</label><input id="n" name="name" value="{{ gr.name }}"></div><div><label for="p">Programme</label><input id="p" name="programme" value="{{ gr.programme }}"></div><div><label for="y">Academic year</label><input id="y" name="year" value="{{ gr.academic_year }}"></div><div><label for="s">Semester</label><input id="s" name="semester" value="{{ gr.semester }}"></div>
<div><label for="m">Mentor</label><select id="m" name="mentor">{% for m in mentors %}<option value="{{ m.id }}" {{ 'selected' if m.id==gr.mentor_id }}>{{ m.name }}</option>{% endfor %}</select></div><div><label for="st">Status</label><select id="st" name="status"><option>active</option><option {{ 'selected' if gr.status=='archived' }}>archived</option></select></div></div>
<label for="d">Description</label><input id="d" name="description" value="{{ gr.description or '' }}"><label for="rs">Reason (if changing mentor)</label><input id="rs" name="reason"><button>Save group</button></form>
<div class="card"><h3>Members ({{ members|length }})</h3><table class="rc"><thead><tr><th>Reg No</th><th>Name</th><th></th></tr></thead>{% for a in members %}<tr><td>{{ a.student.reg_no }}</td><td>{{ a.student.name }}</td><td><form method="post" action="/admin/assignment/{{ a.id }}/remove"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input name="reason" placeholder="Reason" aria-label="Reason" style="width:50%"><button>Remove from group</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
